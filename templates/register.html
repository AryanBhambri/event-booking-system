{% extends "base.html" %}
{% block title %}Create account | Evently{% endblock %}
{% block content %}
<section class="auth-page"><div class="container"><div class="row justify-content-center"><div class="col-md-9 col-lg-6"><div class="auth-card shadow-sm"><p class="eyebrow">JOIN EVENTLY</p><h1>Create your account</h1><p class="text-muted mb-4">Start discovering experiences made for you.</p><form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="name">Full name</label><input class="form-control" id="name" name="name" type="text" value="{{ request.form.get('name', '') }}" autocomplete="name" maxlength="100" required></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" value="{{ request.form.get('email', '') }}" autocomplete="email" maxlength="150" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="new-password" required><div class="form-text">8+ characters, upper/lowercase, and a number.</div></div><div class="col-md-6 mb-4"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required></div></div><button class="btn btn-brand w-100 py-2" type="submit">Create account</button></form><p class="text-center text-muted mt-4 mb-0">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div></div></div></div></section>
{% endblock %}
